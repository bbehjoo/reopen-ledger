    code_source: https://github.com/aave/aave-v4/tree/2524fe4018a42750300e114f2a8c4355df62a878/src/spoke
    liquidation:                    # Spoke.getLiquidationConfig() at as_of
      target_health_factor: 1.24
      health_factor_for_max_bonus: 0.90
      liquidation_bonus_factor: 0.90   # min bonus = 1 + 0.90 * (max_bonus - 1)
      dust_threshold_usd: 1000
      close_factor: none (repay up to the amount that restores target_health_factor; whole position when dust rules apply)
      oracle_staleness_check: none  # AaveOracle reads source.latestAnswer() and requires > 0 only

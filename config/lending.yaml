# Built 2026-11-08 by read-only research (docs/research/LENDING.md has the method, the reads and the math).
# Every market was read on-chain at the block in `as_of`; sizes are snapshots, not configuration.
# Units: lltv / collateral_factor as fractions; bonuses as multipliers (1.055 = 5.5 % bonus).
schema: lending-markets/v0-draft

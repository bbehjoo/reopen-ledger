# Chain facts this project relies on. Every value has a source and the date it was read.
chain_id: 8453

# RPC roles (keyless free tiers, measured 2026-11-08 with read-only calls). A role may list fallbacks.
# Overridable per role by env: RPC_LOGS, RPC_STATE, RPC_ARCHIVE, RPC_SEPOLIA.
rpc:
  logs:      # eth_getLogs
    - https://base-rpc.publicnode.com     # 10,000-block ranges, but only from about block 51,000,000 (early
                                          # September 2026); older ranges answer 403 "Archive requests require
                                          # a personal token"
    - https://gateway.tenderly.co/public/base   # old ranges work, at most 1,000 blocks per request
    # base.drpc.org refuses August ranges at any size ("ranges over 10000 blocks are not supported on free
    # plan", even for 1,000 blocks), so it is not a logs endpoint here
  state:     # eth_call at the latest block, block headers
    - https://mainnet.base.org            # getLogs answers -32011 "request limit reached"; eth_call fine
    - https://base-rpc.publicnode.com
  archive:   # eth_call at historical blocks
    - https://base.drpc.org
    - https://gateway.tenderly.co/public/base   # getLogs capped at 1,000 blocks without a key
    - https://mainnet.base.org
  sepolia:
    - https://sepolia.base.org
    - https://base-sepolia-rpc.publicnode.com
  # not usable keyless any more: rpc-base.blockmachine.io serves logs for the most recent 100 blocks only
  # and no historical state (error text read 2026-11-08)

# Block number <-> time. Block n of a segment is at first_ts_ms + (n - first_block) * block_ms.
block_time:
  - first_block: 0
    first_ts_ms: 1686789347000
    block_ms: 2000
    source: https://mainnet.base.org
    verified: "2026-11-08: block 53556126 has timestamp 1793901599 = 1686789347 + 2 * 53556126"
  - first_block: 53556128
    first_ts_ms: 1793901601200
    block_ms: 200
    source: https://github.com/base/base/releases/tag/v1.5.1
    verified: >-
      2026-11-08: blocks 53556127, 53556128, 53556129 have timestampMs 1793901601000, 1793901601200,
      1793901601400 (Denim, 200 ms blocks from 2026-11-05 18:00:01 UTC); block 54900000 has timestampMs
      1794170375600 = 1793901601200 + 200 * (54900000 - 53556128)


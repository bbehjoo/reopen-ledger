[project]
name = "callrec"
version = "0.1.0"
description = "Reopen Ledger: an open record of tokenized-stock calls scored against the reference feed, the weekend tape, and what these markets can absorb. Measurements, not verdicts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Reopen Ledger contributors" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cryptography>=43.0",
  "eth-account>=0.13",
  "eth-utils>=6.0.0",
  "typer>=0.12",
  "tzdata>=2024.1",
  "python-dotenv>=1.0",
  "markdown>=3.6",
]

[project.scripts]
callrec = "callrec.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
